name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Flatpak and Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Setup Flathub and Flatpak SDKs
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build Application with Flatpak Builder
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=.repo .flatpak-build com.squidspirit.Messenger.yml

      - name: Export Standalone Flatpak Bundle
        run: |
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            .repo "Messenger-${{ github.ref_name }}.flatpak" com.squidspirit.Messenger

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-${{ github.ref_name }}
          path: Messenger-${{ github.ref_name }}.flatpak

      - name: Extract Tag Message
        run: |
          git tag -l --format='%(contents)' "${{ github.ref_name }}" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: Messenger-${{ github.ref_name }}.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
