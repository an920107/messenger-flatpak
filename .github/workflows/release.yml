name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Flatpak SDK & Runtimes
        id: cache-flatpak
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flatpak
            ~/.cache/flatpak
          key: flatpak-sdk-${{ runner.os }}-${{ hashFiles('com.squidspirit.Messenger.yml') }}
          restore-keys: |
            flatpak-sdk-${{ runner.os }}-

      - name: Cache Flatpak Builder State
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'com.squidspirit.Messenger.yml') }}
          restore-keys: |
            flatpak-builder-${{ runner.os }}-

      - name: Install Flatpak and Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Setup Flathub and Flatpak SDKs
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build Application with Flatpak Builder
        run: |
          flatpak-builder --user --disable-rofiles-fuse --repo=.repo .flatpak-build com.squidspirit.Messenger.yml

      - name: Export Standalone Flatpak Bundle
        run: |
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            .repo "Messenger-${{ github.ref_name }}.flatpak" com.squidspirit.Messenger

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-${{ github.ref_name }}
          path: Messenger-${{ github.ref_name }}.flatpak

      - name: Extract Tag Notes & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          TAG_NOTE=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          
          if [ -n "$TAG_NOTE" ]; then
            echo "$TAG_NOTE" > release_notes.md
          else
            gh api "repos/${{ github.repository }}/git/ref/tags/${{ github.ref_name }}" --jq .object.sha | \
              xargs -I {} gh api "repos/${{ github.repository }}/git/tags/{}" --jq .message > release_notes.md 2>/dev/null || true
          fi
          
          echo "=== Release Notes Content ==="
          cat release_notes.md
          echo "============================="
          
          gh release delete "${{ github.ref_name }}" -y 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            "Messenger-${{ github.ref_name }}.flatpak" \
            --title "${{ github.ref_name }}" \
            --notes-file release_notes.md
